name: dog-finder-local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dog_finder_dev
      POSTGRES_USER: dog_finder_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - development-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dog_finder_dev -d dog_finder_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_DB: dog_finder_test_control
      POSTGRES_USER: dog_finder_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dog_finder_test -d dog_finder_test_control"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  development-db:
