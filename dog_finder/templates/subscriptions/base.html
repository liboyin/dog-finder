<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Finder</title>
  <style>
    body { font: 1rem/1.6 system-ui, sans-serif; color: #24352b; background: #f6f8f4; margin: 0; }
    main { max-width: 42rem; margin: 3rem auto; padding: 1.5rem; }
    input, select, textarea, button { font: inherit; padding: .6rem; box-sizing: border-box; }
    input, select, textarea { display: block; width: 100%; }
    button { background: #28533b; color: white; border: 0; border-radius: .3rem; cursor: pointer; }
    a { color: #28533b; } .errorlist { color: #9b2525; } .helptext { display: block; }
  </style>
</head>
<body><main>
  <a href="/">Dog Finder</a>
  {% block content %}{% endblock %}
  <p><small>Postcode reference: <a href="https://www.geonames.org/" rel="noreferrer">GeoNames</a>, CC BY 4.0.</small></p>
</main></body>
</html>
